<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chapters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Chapters for {{ subject.name }}</h1>
        <a href="{{ url_for('main.admin_create_chapter', subject_id=subject.id) }}" class="btn btn-primary mb-3">Create New Chapter</a>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for chapter in chapters %}
                <tr>
                    <td>{{ chapter.id }}</td>
                    <td>{{ chapter.name }}</td>
                    <td>{{ chapter.description }}</td>
                    <td>
                        <a href="{{ url_for('main.admin_edit_chapter', chapter_id=chapter.id) }}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="{{ url_for('main.admin_delete_chapter', chapter_id=chapter.id) }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>
    </div>
    

</body>
</html>
