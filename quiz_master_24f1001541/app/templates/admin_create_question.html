<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mt-4">Create New Question for Quiz {{ quiz.id }}</h1>

        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        
        <form method="POST">
            <div class="form-group mb-3">
                <label for="question_statement">Question Statement</label>
                <textarea class="form-control" id="question_statement" name="question_statement" rows="3" required></textarea>
            </div>
            <div class="form-group mb-3">
                <label for="option1">Option 1</label>
                <input type="text" class="form-control" id="option1" name="option1" required>
            </div>
            <div class="form-group mb-3">
                <label for="option2">Option 2</label>
                <input type="text" class="form-control" id="option2" name="option2" required>
            </div>
            <div class="form-group mb-3">
                <label for="option3">Option 3</label>
                <input type="text" class="form-control" id="option3" name="option3" required>
            </div>
            <div class="form-group mb-3">
                <label for="option4">Option 4</label>
                <input type="text" class="form-control" id="option4" name="option4" required>
            </div>
            <div class="form-group mb-3">
                <label for="correct_option">Correct Option</label>
                <input type="text" class="form-control" id="correct_option" name="correct_option" required>
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>

        
        <a href="{{ url_for('main.admin_questions', quiz_id=quiz.id) }}" class="btn btn-secondary mt-3">Back to Questions</a>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
