<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Quizzes for {{ chapter.name }}</h1>
        <a href="{{ url_for('main.admin_create_quiz', chapter_id=chapter.id) }}" class="btn btn-primary mb-3">Create New Quiz</a>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Duration</th>
                    <th>Remarks</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for quiz in quizzes %}
                <tr>
                    <td>{{ quiz.id }}</td>
                    <td>{{ quiz.date_of_quiz }}</td>
                    <td>{{ quiz.time_duration }}</td>
                    <td>{{ quiz.remarks }}</td>
                    <td>
                        <a href="{{ url_for('main.admin_edit_quiz', quiz_id=quiz.id) }}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="{{ url_for('main.admin_delete_quiz', quiz_id=quiz.id) }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>
    </div>
    

</body>
</html>
